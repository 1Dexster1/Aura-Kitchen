name: Deploy Aura Kitchen Unity WebGL to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Aura Kitchen Android APK"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unity-build-pipeline
  cancel-in-progress: false

jobs:
  build-webgl:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space on Runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          echo "Disk space after cleanup:"
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL via GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 2022.3.1f1
          dockerShmSize: 3g
          buildsPath: build

      - name: Output Unity Log on Failure
        if: failure()
        run: |
          echo "=== Displaying Unity Editor Logs ==="
          find / -name "Editor.log" 2>/dev/null -exec tail -n 100 {} + || true

      - name: Prepare WebGL for GitHub Pages
        run: |
          mkdir -p public
          if [ -d "build/WebGL/WebGL" ]; then
            cp -r build/WebGL/WebGL/* public/
          elif [ -d "build/WebGL" ]; then
            cp -r build/WebGL/* public/
          fi
          touch public/.nojekyll

          echo "=== Processing WebGL build files ==="
          ls -la public/

          # GitHub Pages does not serve Brotli/Gzip Content-Encoding headers for static files.
          # If Unity produced compressed .br or .gz files, decompress them so GitHub Pages serves them directly:
          if [ -d "public/Build" ]; then
            sudo apt-get update && sudo apt-get install -y brotli
            cd public/Build

            for f in *.br; do
              [ -e "$f" ] || continue
              echo "Decompressing $f..."
              brotli -d "$f"
              rm -f "$f"
            done

            for f in *.gz; do
              [ -e "$f" ] || continue
              echo "Decompressing $f..."
              gzip -d "$f"
            done
            cd ../..

            if [ -f "public/index.html" ]; then
              echo "Updating index.html references to uncompressed filenames..."
              sed -i 's/\.framework\.js\.br/\.framework\.js/g' public/index.html
              sed -i 's/\.data\.br/\.data/g' public/index.html
              sed -i 's/\.wasm\.br/\.wasm/g' public/index.html
              sed -i 's/\.framework\.js\.gz/\.framework\.js/g' public/index.html
              sed -i 's/\.data\.gz/\.data/g' public/index.html
              sed -i 's/\.wasm\.gz/\.wasm/g' public/index.html
              sed -i 's/\.br"/\x22/g' public/index.html
              sed -i "s/\.br'/\x27/g" public/index.html
              sed -i 's/\.gz"/\x22/g' public/index.html
              sed -i "s/\.gz'/\x27/g" public/index.html
            fi

            echo "=== Final public/Build contents ==="
            ls -la public/Build
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-webgl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
