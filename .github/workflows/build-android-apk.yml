name: Build Aura Kitchen Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free Disk Space on Runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          echo "Disk space after cleanup:"
          df -h

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android via GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.1f1
          androidExportType: androidPackage
          dockerShmSize: 3g
          buildsPath: build

      - name: Output Unity Log on Failure
        if: failure()
        run: |
          echo "=== Displaying Unity Editor Logs ==="
          find / -name "Editor.log" 2>/dev/null -exec tail -n 100 {} + || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Kitchen-Android-APK
          path: build/Android/**
          retention-days: 14

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: build/Android/**
          tag_name: v1.0.0-aura
          name: Aura Kitchen v1.0.0 APK
          body: |
            🎮 **Aura Kitchen - Android APK Build**
            - 4-Player Online Co-Op & Offline Solo Play
            - Dynamic Customer System with patience & tipping
            - Expanded 4-Chef Kitchen Layout
            - Mobile Touch Virtual Joystick & Action Buttons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

